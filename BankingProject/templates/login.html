{% extends 'base.html' %}

{% block content %}

<div style="max-width: 450px; margin: 50px auto;">

    <div class="card">

        <h1 style="text-align: center;">
            Bank Login
        </h1>

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                style="width: 100%;"
            >
                Login
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
