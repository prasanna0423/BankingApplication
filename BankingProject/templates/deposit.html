{% extends 'base.html' %}

{% block content %}

<h1>Deposit Money</h1>

<div class="card">

    <h2>Current Balance</h2>

    <h2>
        ₹{{ account.balance|floatformat:2 }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        <label for="amount">
            Deposit Amount
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            placeholder="Enter amount"
            required
        >

        <button type="submit">
            Deposit Money
        </button>

    </form>

</div>

{% endblock %}
