{% extends 'base.html' %}

{% block content %}

<div style="max-width: 500px; margin: 40px auto;">

    <div class="card">

        <h1 style="text-align: center;">
            Create Bank Account
        </h1>

        <form method="POST">

            {% csrf_token %}

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter address"
                required
            ></textarea>

            <button
                type="submit"
                style="width: 100%;"
            >
                Create Account
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
