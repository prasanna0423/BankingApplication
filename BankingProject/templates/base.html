<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Banking App</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* Navigation */

        nav {
            background: #123c69;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        /* Headings */

        h1 {
            margin-bottom: 25px;
            color: #123c69;
        }

        h2 {
            margin-bottom: 15px;
        }

        h3 {
            margin-top: 15px;
            margin-bottom: 8px;
        }

        /* Cards */

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        /* Forms */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #123c69;
        }

        /* Buttons */

        button {
            margin-top: 20px;
            padding: 12px 22px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2f52;
        }

        /* Messages */

        .message {
            padding: 12px 18px;
            background: #e8f5e9;
            color: #256029;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        /* Tables */

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #123c69;
            color: white;
        }

        tr:hover {
            background: #f5f7fa;
        }

        /* Links */

        a {
            color: #123c69;
        }

        /* Mobile */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
                padding: 18px;
            }

            nav a {
                margin: 5px;
                display: inline-block;
            }

            .container {
                width: 94%;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            🏦 Banking App
        </div>

        <div>

            {% if user.is_authenticated %}

                <a href="{% url 'dashboard' %}">Dashboard</a>

                <a href="{% url 'deposit' %}">Deposit</a>

                <a href="{% url 'withdraw' %}">Withdraw</a>

                <a href="{% url 'transfer' %}">Transfer</a>

                <a href="{% url 'transactions' %}">Transactions</a>

                <a href="{% url 'logout' %}">Logout</a>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

                <a href="{% url 'register' %}">Register</a>

            {% endif %}

        </div>

    </nav>


    <div class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
