{% extends 'base.html' %}

{% block content %}

<h1>Transfer Money</h1>

<div class="card">

    <h2>Current Balance</h2>

    <h2>
        ₹{{ account.balance|floatformat:2 }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        <label for="account_number">
            Receiver Account Number
        </label>

        <input
            type="text"
            id="account_number"
            name="account_number"
            placeholder="Example: ACC000003"
            required
        >

        <label for="amount">
            Transfer Amount
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            placeholder="Enter amount"
            required
        >

        <button type="submit">
            Transfer Money
        </button>

    </form>

</div>

{% endblock %}
